[project]
name = "harbor-report-demo"
version = "0.1.0"
description = "A deepagents research agent evaluated with Harbor, recording results to LangSmith."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # The agent under test. Keep in sync with deep-agent/langgraph.json, which
    # Harbor uses to install deps inside the sandbox.
    "deepagents>=0.7.7,<0.8",
    "langchain-anthropic>=1.6,<2",
    # Used by dev.py (init_chat_model) and the LangChain runtime.
    "langchain>=1.3,<2",
    "langchain-core>=1.6,<2",
    "langsmith>=0.11,<0.12",
    # The eval harness CLI + its LangSmith plugin (`harbor run ... --plugin langsmith`).
    "harbor>=0.21,<0.22",
    "harbor-langsmith>=0.3,<0.4",
]

[dependency-groups]
# The verifier (dataset/*/tests/test_outputs.py) runs pytest inside the sandbox,
# but keeping it here lets you run the tests locally too.
dev = ["pytest>=9,<10"]

[tool.uv]
# This repo is an application, not an installable library — don't build/install
# the project root, just manage its dependencies.
package = false
